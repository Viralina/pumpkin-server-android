<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Pumpkin Panel for Android — original banner</title>
  <desc id="desc">Original artwork created for this project (Apache-2.0). It is not the official Pumpkin logo and is not affiliated with Pumpkin-MC.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f0c"/>
      <stop offset="0.55" stop-color="#0d1511"/>
      <stop offset="1" stop-color="#0a120d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pumpkin" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffb057"/>
      <stop offset="0.45" stop-color="#f98a2b"/>
      <stop offset="1" stop-color="#d9611a"/>
    </linearGradient>
    <linearGradient id="pumpkinDark" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f18a2f"/>
      <stop offset="1" stop-color="#b94c12"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101914"/>
      <stop offset="1" stop-color="#0b120e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#22c55e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22c55e" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="340" rx="22"/>
    </clipPath>
  </defs>

  <!-- background -->
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <ellipse cx="250" cy="180" rx="300" ry="200" fill="url(#glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="21.5" fill="none" stroke="#22c55e" stroke-opacity="0.18"/>

  <!-- pumpkin illustration -->
  <g filter="url(#shadow)">
    <ellipse cx="232" cy="292" rx="128" ry="16" fill="#000" opacity="0.45"/>
    <ellipse cx="232" cy="196" rx="126" ry="96" fill="url(#pumpkinDark)"/>
    <ellipse cx="186" cy="196" rx="62" ry="94" fill="url(#pumpkin)" opacity="0.92"/>
    <ellipse cx="278" cy="196" rx="62" ry="94" fill="url(#pumpkin)" opacity="0.92"/>
    <ellipse cx="232" cy="194" rx="104" ry="96" fill="url(#pumpkin)"/>
    <path d="M176 132c-18 30-17 96 4 126" fill="none" stroke="#b94c12" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
    <path d="M288 132c18 30 17 96-4 126" fill="none" stroke="#b94c12" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
    <path d="M150 168c-12 22-10 58 2 80" fill="none" stroke="#ffc27a" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
    <path d="M204 108c-10-10-14-24-8-36" fill="none" stroke="url(#stem)" stroke-width="16" stroke-linecap="round"/>
    <path d="M212 82c22-22 52-22 72-6-18 20-48 24-72 6z" fill="url(#leaf)"/>
    <path d="M212 82c14 4 30 2 44-8" fill="none" stroke="#065f46" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    <!-- minimal carved face -->
    <path d="M186 186l18-16 18 16-8 20h-20z" fill="#3b1706" opacity="0.9"/>
    <path d="M242 186l18-16 18 16-8 20h-20z" fill="#3b1706" opacity="0.9"/>
    <path d="M198 236c22 18 50 18 72 0-6 20-22 30-36 30s-30-10-36-30z" fill="#3b1706" opacity="0.9"/>
  </g>

  <!-- terminal card -->
  <g filter="url(#shadow)">
    <rect x="400" y="74" width="512" height="192" rx="16" fill="url(#card)" stroke="url(#edge)"/>
    <path d="M400 106h512" stroke="#22c55e" stroke-opacity="0.16"/>
    <circle cx="426" cy="90" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="444" cy="90" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="462" cy="90" r="5" fill="#22c55e" opacity="0.9"/>
    <text x="486" y="95" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5">pumpkin-panel — 127.0.0.1:8087</text>

    <text x="428" y="142" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ ./pumpkin</text>
    <text x="428" y="176" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">java <tspan fill="#e2e8f0">25565</tspan>  <tspan fill="#475569">·</tspan>  bedrock <tspan fill="#e2e8f0">19132</tspan></text>
    <text x="428" y="210" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">panel <tspan fill="#e2e8f0">8087</tspan>   <tspan fill="#475569">·</tspan>  <tspan fill="#22c55e">● online</tspan></text>
    <text x="428" y="244" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">android · webview · no root · offline-first</text>
  </g>

  <!-- wordmark -->
  <text x="952" y="146" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="45" font-weight="800" letter-spacing="0.5">PUMPKIN</text>
  <text x="952" y="194" fill="#22c55e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="45" font-weight="800" letter-spacing="0.5">PANEL</text>
  <text x="955" y="224" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" letter-spacing="3.2">ANDROID CONTROL PANEL</text>
  <rect x="955" y="242" width="118" height="4" rx="2" fill="#22c55e"/>
</svg>
